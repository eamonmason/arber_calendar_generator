AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Arbor Calendar Sync - Weekly Lambda function to sync Arbor calendar with Google Calendar'

Parameters:
  GoogleCalendarId:
    Type: String
    Description: Google Calendar ID where events will be synced
    Default: "primary"

  ArborBaseUrl:
    Type: String
    Description: Base URL for Arbor MIS
    Default: "https://your-school.uk.arbor.sc"

  ArborStudentObjectId:
    Type: String
    Description: Student object ID in Arbor system
    NoEcho: true

  ArborUsername:
    Type: String
    Description: Arbor username for automatic login
    NoEcho: true

  ArborPassword:
    Type: String
    Description: Arbor password for automatic login
    NoEcho: true

  UpdateExistingEvents:
    Type: String
    Description: Whether to update existing events
    Default: "true"
    AllowedValues: ["true", "false"]

  DeleteOrphanedEvents:
    Type: String
    Description: Whether to delete orphaned events
    Default: "true"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Timeout: 900  # 15 minutes (maximum allowed for Lambda)
    MemorySize: 3072  # Further increased for Playwright browser stability

Resources:
  # Parameter Store parameters for configuration
  ArborUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${AWS::StackName}/arbor/username'
      Description: 'Arbor username for calendar sync'
      Type: String
      Tier: Standard
      Value: !Ref ArborUsername

  ArborPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${AWS::StackName}/arbor/password'
      Description: 'Arbor password for calendar sync'
      Type: String
      Tier: Standard
      Value: !Ref ArborPassword

  # IAM Role for Lambda function
  ArborCalendarSyncFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ParameterStoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*'

  ArborCalendarSyncFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest
    Properties:
      PackageType: Image
      ImageUri: .
      Description: 'Syncs Arbor calendar with Google Calendar weekly on Sundays'
      Role: !GetAtt ArborCalendarSyncFunctionRole.Arn
      Architectures:
        - x86_64
      Environment:
        Variables:
          GOOGLE_CALENDAR_ID: !Ref GoogleCalendarId
          PARAMETER_STORE_PREFIX: !Sub '/${AWS::StackName}'
          GOOGLE_CREDENTIALS_PARAMETER: !Sub '/${AWS::StackName}/google/credentials'
          GOOGLE_TOKEN_PARAMETER: !Sub '/${AWS::StackName}/google/token'
          ARBOR_USERNAME_PARAMETER: !Sub '/${AWS::StackName}/arbor/username'
          ARBOR_PASSWORD_PARAMETER: !Sub '/${AWS::StackName}/arbor/password'
          ARBOR_BASE_URL: !Ref ArborBaseUrl
          ARBOR_STUDENT_OBJECT_ID: !Ref ArborStudentObjectId
          UPDATE_EXISTING_EVENTS: !Ref UpdateExistingEvents
          DELETE_ORPHANED_EVENTS: !Ref DeleteOrphanedEvents
          ARBOR_TIMEZONE: "Europe/London"
      Events:
        WeeklySundaySchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 8 ? * SUN *)'  # Every Sunday at 8 AM UTC
            Description: 'Weekly calendar sync every Sunday morning'
            Input: !Sub |
              {
                "dry_run": false,
                "headless": true
              }

  ArborCalendarSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ArborCalendarSyncFunction}'
      RetentionInDays: 30

Outputs:
  ArborCalendarSyncFunction:
    Description: 'Arbor Calendar Sync Lambda Function ARN'
    Value: !GetAtt ArborCalendarSyncFunction.Arn

  FunctionName:
    Description: 'Lambda Function Name'
    Value: !Ref ArborCalendarSyncFunction

  ScheduleExpression:
    Description: 'EventBridge Schedule Expression'
    Value: 'cron(0 8 ? * SUN *)'

  ParameterStorePrefix:
    Description: 'Parameter Store prefix for all parameters'
    Value: !Sub '/${AWS::StackName}'

  ArborUsernameParameter:
    Description: 'Arbor Username Parameter name'
    Value: !Sub '/${AWS::StackName}/arbor/username'

  ArborPasswordParameter:
    Description: 'Arbor Password Parameter name'
    Value: !Sub '/${AWS::StackName}/arbor/password'