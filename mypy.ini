[mypy]
# General mypy configuration
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = False
strict_equality = True

# Allow missing imports for third-party libraries
ignore_missing_imports = True

# Specific module configurations
[mypy-playwright.*]
ignore_errors = True

[mypy-bs4.*]
ignore_errors = True

[mypy-icalendar.*]
ignore_errors = True

[mypy-googleapiclient.*]
ignore_errors = True

[mypy-google.auth.*]
ignore_errors = True

[mypy-google.oauth2.*]
ignore_errors = True

[mypy-google_auth_oauthlib.*]
ignore_errors = True

[mypy-dateutil.*]
ignore_errors = True

# Allow dynamic attributes for config module
[mypy-config]
disable_error_code = attr-defined

# Less strict checking for test files
[mypy-test_generate_school_calendar]
disallow_untyped_defs = False
disallow_incomplete_defs = False
ignore_errors = True

[mypy-test_google_calendar_sync]
disallow_untyped_defs = False
disallow_incomplete_defs = False
ignore_errors = True