[project]
name = "arbor-calendar-sync"
version = "0.2.0"
description = "Sync school calendar from Arbor API to Google Calendar"
authors = [{name = "Eamon Mason", email = "eamon.mason@thomsonreuters.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "icalendar>=5.0.13",
    "python-dateutil>=2.8.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-python-dateutil",
    "types-beautifulsoup4",
]

[project.scripts]
arbor-calendar-sync = "generate_school_calendar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "mypy>=1.18.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.13.0",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-boto3>=1.40.30",
    "types-python-dateutil>=2.9.0.20250822",
    "types-requests>=2.32.4.20250913",
]
